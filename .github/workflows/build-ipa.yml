name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Xcode Environment
        run: |
          echo "=== Xcode Version ==="
          xcodebuild -version

          echo "=== Xcode Projects and Schemes ==="
          xcodebuild -project PrivateVaultPro/PrivateVaultPro.xcodeproj -list > xcode_list.log 2>&1 || LIST_STATUS=$?
          cat xcode_list.log
          if [ "${LIST_STATUS:-0}" -ne 0 ]; then
            echo "::error::xcodebuild -list failed with exit code ${LIST_STATUS}!"
            tail -n 30 xcode_list.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "${LIST_STATUS}"
          fi

      - name: Build Application Binary
        run: |
          CONFIG="${{ inputs.build_configuration || 'Release' }}"
          echo "==> Compiling PrivateVault Pro (${CONFIG})..."
          
          mkdir -p build/DerivedData

          xcodebuild build \
            -project PrivateVaultPro/PrivateVaultPro.xcodeproj \
            -scheme PrivateVaultPro \
            -configuration "${CONFIG}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" > xcodebuild_build.log 2>&1 || BUILD_STATUS=$?

          if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
            echo "::error::Build failed with exit code ${BUILD_STATUS}!"
            tail -n 30 xcodebuild_build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "${BUILD_STATUS}"
          fi

      - name: Package IPA
        run: |
          echo "==> Packaging into IPA payload..."
          mkdir -p build/Payload
          
          APP_PATH=$(find build/DerivedData/Build/Products -name "PrivateVaultPro.app" | grep iphoneos | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Searching all products directory..."
            APP_PATH=$(find build/DerivedData/Build/Products -name "PrivateVaultPro.app" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PrivateVaultPro.app not found!"
            find build/DerivedData -name "*.app" || true
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          
          cd build
          zip -qr PrivateVaultPro.ipa Payload
          cd ..

          echo "==> Verifying final IPA:"
          ls -lh build/PrivateVaultPro.ipa
          unzip -l build/PrivateVaultPro.ipa | head -n 25

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateVaultPro-iOS-IPA
          path: build/PrivateVaultPro.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PrivateVaultPro.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
