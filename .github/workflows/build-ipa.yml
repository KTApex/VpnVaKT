name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Xcode Environment
        run: |
          echo "### Xcode Environment" >> $GITHUB_STEP_SUMMARY
          xcodebuild -version | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          xcodebuild -project PrivateVaultPro/PrivateVaultPro.xcodeproj -list | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Application Binary
        run: |
          CONFIG="${{ inputs.build_configuration || 'Release' }}"
          echo "==> Compiling PrivateVault Pro (${CONFIG})..."
          
          mkdir -p build/DerivedData

          set -o pipefail
          xcodebuild clean build \
            -project PrivateVaultPro/PrivateVaultPro.xcodeproj \
            -scheme PrivateVaultPro \
            -configuration "${CONFIG}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcodebuild_build.log || BUILD_STATUS=$?

          if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
            echo "::error::xcodebuild compilation failed with status ${BUILD_STATUS}!"
            echo "### Build Failure Log (Last 150 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 xcodebuild_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit "${BUILD_STATUS}"
          fi

      - name: Package IPA
        run: |
          echo "==> Packaging into IPA payload..."
          mkdir -p build/Payload
          
          APP_PATH=$(find build/DerivedData/Build/Products -name "PrivateVaultPro.app" | grep iphoneos | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Searching all products directory..."
            APP_PATH=$(find build/DerivedData/Build/Products -name "PrivateVaultPro.app" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PrivateVaultPro.app not found!"
            find build/DerivedData -name "*.app" || true
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          
          cd build
          zip -qr PrivateVaultPro.ipa Payload
          cd ..

          echo "==> Verifying final IPA:"
          ls -lh build/PrivateVaultPro.ipa
          unzip -l build/PrivateVaultPro.ipa | head -n 25

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build-log
          path: xcodebuild_build.log
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateVaultPro-iOS-IPA
          path: build/PrivateVaultPro.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PrivateVaultPro.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
